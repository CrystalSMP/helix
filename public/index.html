<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helix – AI Tickets for Discord</title>
<meta name="description" content="Helix: Discord ticket system with Gemini AI and a web dashboard for large server networks.">
<meta name="theme-color" content="#07080d">
<link rel="icon" href="logo.svg"><link rel="stylesheet" href="style.css">
<script>document.write('<script src="tunnel.js?v=' + Date.now() + '"><\/script>')</script>
</head>
<body>
<header><a class="logo" href="./"><img src="logo.svg" alt=""><span>Helix</span></a><div id="nav"></div></header>
<main id="app"></main>
<footer>⬡ Helix · AI support for Discord networks</footer>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = document.getElementById('app');

function statusPage(title, message, badge, color) {
  app.innerHTML = `<div class="hero"><img class="mark" src="logo.svg" alt=""><br><span class="badge" style="background:${color}">${esc(badge)}</span>
    <h1>${esc(title)}</h1><p>${esc(message)}</p></div>`;
}

const FEATURES = [
  ['🤖', 'Gemini AI in every ticket', 'Asks what the user needs, answers FAQs instantly and only forwards what matters.'],
  ['🎨', 'Panel Designer', 'Design the title, text, color and button – with a live Discord-style preview.'],
  ['📚', 'Server Knowledge', 'Upload rules, FAQs and shop info. The more you add, the smarter the AI.'],
  ['🗂️', 'Smart Categories', 'Ban, report, payment … the AI sorts tickets and pings the right role.'],
  ['📜', 'Transcripts', 'Every closed ticket is saved as a file in your log channel.'],
  ['🌐', 'Built for networks', 'One bot, unlimited servers – each with its own settings.'],
];

function landing(banner) {
  app.innerHTML = banner + `<section class="hero">
      <img class="mark" src="logo.svg" alt="">
      <div><span class="pill"><i></i> Powered by Google Gemini</span></div>
      <h1>Support that <span>thinks</span>.</h1>
      <p>Helix picks up every ticket instantly, understands the request and only hands your team the cases that really need a human.</p>
      <div class="cta"><a class="btn lg" href="/login">Log in with Discord</a><a class="btn lg ghost" href="#features">Learn more</a></div>
      <div class="card demo">
        <div class="bar"># ticket-0042</div>
        <div class="msgs">
          <div class="msg"><div class="av"><img src="logo.svg" alt=""></div><div><b>Helix<em>AI</em></b>Hey @Max! 👋 How can I help you?</div></div>
          <div class="msg"><div class="av">🙂</div><div><b>Max</b>I got banned from the server.</div></div>
          <div class="msg"><div class="av"><img src="logo.svg" alt=""></div><div><b>Helix<em>AI</em></b>Okay, I'll forward your ticket to the moderators.
            <div class="tag">📨 Forwarded · Ban / Unban · @Moderator</div></div></div>
        </div>
      </div>
    </section>
    <section id="features" class="features">${FEATURES.map(([ic, t, d]) =>
      `<div class="card feature"><div class="ic">${ic}</div><h4>${t}</h4><p>${d}</p></div>`).join('')}</section>`;
}

// Auf GitHub Pages: prüfen, ob der PC-Server über den Tunnel online ist, dann weiterleiten
async function onPages() {
  const s = window.SITE || {};
  if (s.state === 'maintenance') return statusPage(s.title || '🛠️ Maintenance', s.message || 'Helix is under maintenance.', 'Maintenance', 'var(--warn)');
  statusPage('Connecting…', 'Starting Helix.', 'Online check', 'var(--acc)');
  if (window.TUNNEL_URL) {
    const alive = await fetch(window.TUNNEL_URL + '/api/health', { signal: AbortSignal.timeout(5000) }).then((r) => r.ok).catch(() => false);
    if (alive) return location.replace(window.TUNNEL_URL + location.search);
  }
  statusPage(s.title || 'Currently offline', s.message || 'The dashboard is not reachable right now. The bot may still be running – this page keeps checking automatically.', 'Offline', 'var(--bad)');
  // Automatisch neu prüfen – sobald der Tunnel online ist, geht's weiter
  setTimeout(() => location.reload(), 15000);
}

async function boot() {
  let mode = {};
  try { mode = await (await fetch('/api/mode')).json(); } catch {}
  if (mode.state === 'maintenance') return statusPage(mode.title, mode.message, 'Maintenance', 'var(--warn)');
  const banner = mode.title || mode.message
    ? `<div class="banner ${mode.state === 'ai-off' ? 'warn' : ''}"><b>${esc(mode.title)}</b> ${esc(mode.message)}</div>` : '';

  const r = await fetch('/api/me');
  if (r.status === 401) return landing(banner);
  const { user, guilds, invite } = await r.json();
  const av = user.avatar ? `<img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64" alt="">` : '';
  document.getElementById('nav').innerHTML = `${av}${esc(user.name)} · <a href="/logout">Log out</a>`;
  app.innerHTML = banner + `<h2>Your servers</h2><div class="grid">${guilds.map((g) => `
    <a class="card guild" href="/guild/${g.id}">${g.icon ? `<img src="${esc(g.icon)}" alt="">` : '<div class="ph">#</div>'}<b>${esc(g.name)}<small>Open settings →</small></b></a>`).join('')}
    <a class="card guild" href="${invite}" target="_blank"><div class="ph">+</div><b>Invite Helix<small>Add to a new server</small></b></a></div>`;
}

location.hostname.endsWith('github.io') ? onPages() : boot();
</script>
</body></html>
